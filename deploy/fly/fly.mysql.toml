# Base MySQL de Quai Antique sur Fly.io : application privée (aucun port public),
# jointe par l'application web à l'adresse quai-antique-jmf-mysql.internal.
app = "quai-antique-jmf-mysql"
primary_region = "cdg"

[build]
  image = "mysql:8.4.13"

[env]
  MYSQL_DATABASE = "quai_antique"
  MYSQL_USER = "quai_antique"

[processes]
  app = "--datadir /data/mysql"

[mounts]
  source = "mysqldata"
  destination = "/data"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
