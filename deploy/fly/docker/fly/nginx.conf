# Nginx de l'image Fly.io : sert le Front et transmet /api à PHP-FPM (127.0.0.1:9000).
# Fly.io place son proxy HTTPS devant : l'adresse réelle du visiteur arrive dans Fly-Client-IP.
# Elle est reprise comme adresse client pour que les limiteurs de connexion et d'inscription
# comptent bien chaque visiteur, et non le proxy.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header Fly-Client-IP;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files /index.html =404;
    }

    location ~ \.html$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location = /api {
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/app/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/app/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /uploads/ {
        alias /var/www/app/public/uploads/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
