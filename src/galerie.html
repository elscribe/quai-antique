<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quai Antique — Galerie</title>
    <link rel="stylesheet" href="styles.css?v=front-audit-2026-10-28" />
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <header class="site-header">
      <a class="brand" href="index.html">Quai Antique</a
      ><button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="main-navigation"
      >
        Menu
      </button>
      <nav
        id="main-navigation"
        class="main-nav"
        aria-label="Navigation principale"
      >
        <a href="index.html">Accueil</a><a href="carte.html">Carte</a
        ><a aria-current="page" href="galerie.html">Galerie</a
        ><a data-session-nav href="connexion.html">Connexion</a>
      </nav>
    </header>
    <main id="contenu">
      <section class="page-intro">
        <p>NOTRE GALERIE</p>
        <h1>Notre galerie</h1>
        <span></span>
        <p>
          Sélectionnez une image pour découvrir l’assiette, le savoir-faire ou l’ambiance.
        </p>
      </section>
      <p id="gallery-status" role="status">Chargement de la galerie…</p>
      <section class="gallery-page" id="gallery-list" aria-label="Photographies du restaurant"></section>
      <section class="gallery-actions" aria-label="Actions après la galerie">
        <a class="button button--outline" href="carte.html">Voir la carte</a>
        <a class="button" href="reservation.html">Réserver une table</a>
      </section>
    </main>
    <dialog
      id="gallery-dialog"
      class="gallery-dialog"
      aria-labelledby="gallery-dialog-title"
    >
      <button class="dialog-close" type="button" aria-label="Fermer l'image">
        ×</button
      ><p id="gallery-dialog-title"></p>
    </dialog>
    <footer class="site-footer site-footer--compact">
      <p>© 2026 Le Quai Antique. Tous droits réservés.</p>
    </footer>
    <script type="module" src="main.js?v=front-audit-2026-10-28"></script>
    <script type="module" src="galerie-api.js"></script>
  </body>
</html>
